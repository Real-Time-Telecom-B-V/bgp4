! FRR side of the vector capture. Documentation ranges only:
! addresses from RFC 5737 / RFC 3849, AS numbers from RFC 5398.
frr defaults traditional
hostname frr
log stdout
!
route-map EXPORT permit 10
 set metric 50
 set community 64496:100
 set large-community 64496:1:2
 set extcommunity rt 64496:1
 set as-path prepend 64496
!
route-map IMPORT permit 10
!
router bgp 64496
 bgp router-id 192.0.2.1
 no bgp network import-check
 neighbor 192.0.2.2 remote-as 64497
 neighbor 192.0.2.2 timers 3 9
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.2 route-map EXPORT out
  neighbor 192.0.2.2 route-map IMPORT in
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:100::/48
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map EXPORT out
  neighbor 192.0.2.2 route-map IMPORT in
 exit-address-family
!
