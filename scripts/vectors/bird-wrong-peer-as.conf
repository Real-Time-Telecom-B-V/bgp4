# Same as bird.conf, but expecting the wrong AS from the neighbour, so the
# session fails in OPEN with a Bad Peer AS notification.
router id 192.0.2.2;

protocol device {}

protocol bgp peer {
    local 192.0.2.2 as 64497;
    neighbor 192.0.2.1 as 64511;
    hold time 9;
    ipv4 { import all; export none; };
    ipv6 { import all; export none; };
}
