# .github/workflows/ci.yml — bgp4 CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Required check. The job name is what the branch ruleset matches on.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The encoder tests hand our bytes to Wireshark's dissector. They skip
      # when tshark is missing, so CI insists on it.
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark

      - name: Test
        run: cargo test --all-features
        env:
          BGP4_REQUIRE_WIRESHARK: "1"

      # Keep the benchmarks compiling.
      - name: Benches compile
        run: cargo bench --no-run

  # Not a required check: it needs a nightly toolchain, and a short run proves
  # little by passing. A failure is still a real finding. The fuzz crate is
  # separate from the published one, see fuzz/Cargo.toml.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed the corpora from the captured messages
        run: scripts/fuzz-corpus.sh

      - name: Fuzz each target for a minute
        run: |
          for target in message open update; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -max_len=4200
          done

      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
