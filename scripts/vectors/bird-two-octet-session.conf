# Same as bird.conf, but without the 4-octet AS capability, so the peer has to
# fall back to AS_TRANS and AS4_PATH. Documentation ranges only:
# addresses from RFC 5737 / RFC 3849, AS numbers from RFC 5398.
router id 192.0.2.2;

protocol device {}

protocol static static4 {
    ipv4;
    route 203.0.113.0/24 blackhole;
}

protocol static static6 {
    ipv6;
    route 2001:db8:200::/48 blackhole;
}

filter export_static {
    if source != RTS_STATIC then reject;
    bgp_med = 70;
    bgp_community.add((64497, 200));
    bgp_large_community.add((64497, 1, 2));
    accept;
}

protocol bgp peer {
    local 192.0.2.2 as 64497;
    neighbor 192.0.2.1 as 64496;
    hold time 9;
    enable as4 off;
    ipv4 { import all; export filter export_static; };
    ipv6 { import all; export filter export_static; };
}
